reason: "A token bucket guarantees a long-run average rate and deliberately allows bursts; the gateway (4.2) accepts at most one message in any one-second interval and rejects the rest. After any quiet spell B's bucket is full, so the first ten messages of a flood warning go out within one second (measured: 10 in one window, against 1 for A): nine are rejected and go back on the queue, so the burst delays those recipients instead of speeding them up, which defeats the only reason BURST exists. Each burst also costs nine of the 20 daily rejections allowed by 4.3; on a day with a few alerts (or when the re-queued messages build up tokens again after a pause) the sender ID is suspended for 24 hours, possibly mid-warning. A spaces every submit at least 1.05 s apart, which reaches 2,000 people in about 35 minutes, within the stated tolerance. The burst only saves the first ten recipients nine seconds."
