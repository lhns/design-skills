reason: "The times are no longer computed from the policy: the trustees fixed them in 2019 and they are painted on the gate boards and printed on season tickets, so the list is the source and must not move. B re-derives them every year from an approximate sunset curve, and a fitted curve rounded to the half hour only matches while each month stays clear of a rounding edge. September's value sits about one minute above 18:00; in leap years the 15th is one day later in the year, so in 2028 and 2032 B closes at 17:30 (last entry 16:30) for all of September while the boards say 18:00, the mismatch Ruth's season-ticket holders complained about. The developer's check covered only 2026-2027. A states Ruth's twelve values directly. B looks like the principled single source because it implements the written policy."
